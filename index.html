<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquarius Kviz AI</title>
  <link rel="icon" type="image/png" href="Aquarius.png">
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="main-wrapper">
    <div class="card-container">

      <!-- Test Axtarış / Giriş Paneli -->
      <div id="searchSection">
        <h1>Aquarius Kviz AI</h1>
        <p>Test kodunu daxil edin və başlayın</p>
        
        <div class="input-group">
          <input type="text" id="quizIdInput" placeholder="Test ID-sini yazın (məs: 1)">
          <button id="loadQuizBtn">Testi Yüklə</button>
        </div>
      </div>

      <!-- Test Sahəsi -->
      <div id="quizSection" style="display: none;">
        <h2 id="quizTitle"></h2>
        <div id="questionsContainer"></div>
        <button id="submitQuizBtn" style="margin-top: 20px;">Nəticəni Göstər</button>
      </div>

      <!-- Nəticə Sahəsi -->
      <div id="resultSection" style="display: none;">
        <h2>Test Bitdi!</h2>
        <p id="scoreText"></p>
        <button id="restartBtn">Yenidən Başla</button>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
