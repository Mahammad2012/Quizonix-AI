<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquarius - AI Math Quiz Generator</title>
  
  <!-- Favicon - Əgər JPEG faylınız varsa, href="Aquarius.jpeg" istifadə edin -->
  <link rel="icon" type="image/jpeg" href="Aquarius.jpeg">
  
  <link rel="stylesheet" href="style.css">

  <!-- Riyazi düsturları (LaTeX) göstərmək üçün MathJax kitabxanası -->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/MathJax.js?config=TeX-MML-AM_CHTML"></script>
</head>
<body>

  <div class="container">
    <h1>Aquarius Math Quiz</h1>
    
    <!-- Fayl Yükləmə Zonası -->
    <div id="dropZone" class="drop-zone">
      <span id="dropZonePrompt" class="drop-zone__prompt">Faylı bura sürükləyin və ya klikləyin</span>
      <input type="file" id="fileInput" class="drop-zone__input" accept=".pdf, .png, .jpg, .jpeg">
    </div>

    <!-- Sual və Səhifə Seçimi Bölməsi -->
    <div class="options-section">
      <label for="pagesInput">Səhifələr (məs: 1,3,5-7):</label>
      <input type="text" id="pagesInput" placeholder="Boş qoysanız hamısı analiz ediləcək">

      <label for="questionsInput">Sualların nömrələri (məs: 2,4,10-15):</label>
      <input type="text" id="questionsInput" placeholder="Boş qoysanız avtomatik seçiləcək">
    </div>

    <button id="generateBtn">Kviz Yarat</button>

    <!-- Yüklənmə İndikatoru -->
    <div id="loading" class="hidden">Riyazi məsələlər analiz edilir... Bu bir az vaxt ala bilər ⏳</div>

    <!-- Kviz Ekrani -->
    <div id="quizContainer" class="hidden">
      <div id="questions"></div>
      <button id="submitBtn">Nəticəni Yoxla</button>
      <div id="result" class="result"></div>
    </div>
  </div>

  <!-- YENİ: Fayl Önizləmə Modalı -->
  <div id="previewModal" class="modal hidden">
    <span class="modal__close">×</span>
    <div class="modal__content">
      <img id="modalImage" class="hidden" src="" alt="Fayl Önizləməsi">
      <div id="modalPdf" class="hidden">
        <p>PDF önizləməsi bu brauzerdə dəstəklənmir. <a id="pdfDownloadLink" href="" target="_blank">Endirərək baxın</a>.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
