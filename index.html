<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquarius Kviz AI</title>
    <link rel="icon" type="image/png" href="Aquarius.png">
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK (Əgər Supabase istifadə edirsinizsə) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="main-wrapper">
        <div class="card-container">
            
            <!-- Axtarış / Məlumat Daxiletmə Paneli -->
            <div id="searchSection">
                <h1>✨ Aquarius Kviz AI</h1>
                <p class="subtitle">Məlumatları daxil edin və testə başlayın</p>
                
                <div class="form-group">
                    <input type="text" id="studentNameInput" placeholder="Adınız">
                    <input type="text" id="studentSurnameInput" placeholder="Soyadınız">
                    <input type="text" id="studentClassInput" placeholder="Sinfiniz (Məs: 10A)">
                    <input type="number" id="quizIdInput" placeholder="Test ID (Məs: 1)">
                </div>

                <button id="loadQuizByIdBtn" class="btn primary-btn full-btn">Testi Aç</button>
            </div>

            <!-- Kviz Ekranı (Test açıldıqda görünür) -->
            <div id="quizContainer" class="quiz-container hidden">
                <div class="quiz-header">
                    <h2 id="quizTitle">Test Başlığı</h2>
                </div>
                <div id="questionBox" class="question-box"></div>
                
                <div class="quiz-nav">
                    <button id="prevQuestionBtn" class="btn secondary-btn">Əvvəlki</button>
                    <button id="nextQuestionBtn" class="btn primary-btn">Növbəti</button>
                    <button id="submitQuizBtn" class="btn primary-btn hidden" style="background-color: #05cd99;">Bitir</button>
                </div>
            </div>

            <!-- Nəticə Ekranı -->
            <div id="resultBox" class="result-box hidden"></div>
            
            <!-- Yüklənir Bildirişi -->
            <div id="loading" class="loading hidden">Yüklənir...</div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
