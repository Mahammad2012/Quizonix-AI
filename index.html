<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquarius - AI Quiz Generator</title>
  
  <!-- Favicon linkini bura əlavə edin -->
  <link rel="icon" type="image/png" href="Aquarius.png">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Aquarius ilə Kviz Yarat</h1>
    
    <!-- SÜRÜKLƏ-BURAX VƏ FAYL SEÇMƏ ZONASI -->
    <div id="dropZone" class="drop-zone">
      <!-- Dəyişiklik CSS-də pointer-events-i idarə etməklə olacaq -->
      <span id="dropZonePrompt" class="drop-zone__prompt">Faylı bura sürükləyin və ya klikləyin</span>
      <!-- Gizli fayl daxiletməsi (Məhdudiyyətlərlə) -->
      <input type="file" name="myFile" id="fileInput" class="drop-zone__input" accept=".pdf, .png, .jpg, .jpeg">
    </div>

    <button id="generateBtn">Kviz Yarat</button>

    <!-- Yüklənmə İndikatoru -->
    <div id="loading" class="hidden">Sənəd analiz edilir və suallar hazırlanır... ⏳</div>

    <!-- Kviz Ekrani -->
    <div id="quizContainer" class="hidden">
      <div id="questions"></div>
      <button id="submitBtn">Nəticəni Yoxla</button>
      <div id="result" class="result"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
