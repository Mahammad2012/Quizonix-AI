<!-- Online Testlər Bölməsi -->
<div class="online-tests-section" style="margin-top: 30px; padding: 20px; background: #1e293b; border-radius: 12px;">
    <h2>🌐 Supabase Online Testlər</h2>
    <p>Bazadan mövcud testi seçin və ya ID/Kod daxil edin:</p>
    
    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
        <input type="number" id="quizIdInput" placeholder="Test ID (Məs: 1)" style="padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; flex: 1;">
        <button id="loadQuizByIdBtn" style="padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer;">Testi Aç</button>
    </div>

    <div style="margin-top: 10px;">
        <button id="fetchQuizListBtn" style="padding: 8px 15px; background: #64748b; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px;">Mövcud Testlərin Siyahısını Göstər</button>
        <div id="quizListContainer" style="margin-top: 10px; max-height: 150px; overflow-y: auto;"></div>
    </div>
</div>
