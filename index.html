<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquarius Kviz AI</title>
    <link rel="icon" type="image/png" href="Aquarius.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="main-wrapper">
        <!-- İstifadəçi Məlumat Sətri -->
        <div class="user-header">
            <div>
                <h2>Xoş gəldiniz, Məhəmməd Rzazadə</h2>
                <p>Sinif: 9A</p>
            </div>
            <div class="user-avatar">MR</div>
        </div>

        <!-- Sınaqlar Bölməsi -->
        <div id="quizListSection">
            <h3 class="section-title">📄 Mövcud Sınaqlar</h3>
            <div id="quizGrid" class="quiz-grid"></div>
        </div>

        <!-- Test Ekranı (İmtahan rejimi) -->
        <div id="quizModalSection" class="hidden">
            <div class="quiz-card-full">
                <div class="quiz-modal-header">
                    <h2 id="modalQuizTitle">Sınaq</h2>
                    <span id="timerText">⏱️ Qalan vaxt: 15:00</span>
                </div>
                <div id="questionsContainer"></div>
                <button id="submitQuizBtn" class="btn submit-btn">Sınağı Bitir</button>
            </div>
        </div>

        <!-- Nəticə və Səhvlərin İzahı Ekranı -->
        <div id="resultModalSection" class="hidden">
            <div class="quiz-card-full">
                <button id="closeResultBtn" class="btn secondary-btn" style="float: right;">← Geri Qayıt</button>
                <h2>Sınaq Nəticəniz və Səhvlər</h2>
                <div id="scoreSummary" class="score-summary"></div>
                <div id="answersReviewContainer" class="answers-review"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
